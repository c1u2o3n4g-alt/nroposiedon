name: Deploy WebGL Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update expiry
        if: github.event_name == 'schedule'
        run: python scripts/update_expiry.py
      - name: Commit automatic expiry
        if: github.event_name == 'schedule'
        run: |
          if ! git diff --quiet -- public/control/runtime.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/control/runtime.json
            git commit -m "Expire WebGL automatically"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
